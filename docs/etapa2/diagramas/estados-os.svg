<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-label="Diagrama de estados da Ordem de Serviço">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#475569" stroke-width="1.6"/>
    </marker>
    <style>
      .state { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 700; }
      .label { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.6; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1000" height="760" fill="#FFFFFF"/>

  <!-- Início -->
  <circle cx="500" cy="28" r="11" fill="#1E293B"/>
  <line x1="500" y1="39" x2="500" y2="60" class="edge" marker-end="url(#arrow)"/>

  <!-- Estados -->
  <g>
    <rect x="380" y="60" width="240" height="64" rx="10" fill="#FEF9C3" stroke="#EAB308" stroke-width="2"/>
    <text x="500" y="99" text-anchor="middle" class="state" fill="#713F12">ORÇAMENTO</text>
  </g>
  <g>
    <rect x="380" y="220" width="240" height="64" rx="10" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
    <text x="500" y="259" text-anchor="middle" class="state" fill="#14532D">APROVADA</text>
  </g>
  <g>
    <rect x="380" y="380" width="240" height="64" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
    <text x="500" y="419" text-anchor="middle" class="state" fill="#1E3A8A">EM_EXECUÇÃO</text>
  </g>
  <g>
    <rect x="100" y="560" width="240" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
    <text x="220" y="599" text-anchor="middle" class="state" fill="#1E293B">FINALIZADA</text>
  </g>
  <g>
    <rect x="660" y="560" width="240" height="64" rx="10" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <text x="780" y="599" text-anchor="middle" class="state" fill="#7F1D1D">CANCELADA</text>
  </g>

  <!-- Transições principais -->
  <line x1="500" y1="124" x2="500" y2="220" class="edge" marker-end="url(#arrow)"/>
  <rect x="510" y="160" width="92" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="556" y="176" text-anchor="middle" class="label">aprovar()</text>

  <line x1="500" y1="284" x2="500" y2="380" class="edge" marker-end="url(#arrow)"/>
  <rect x="510" y="320" width="86" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="553" y="336" text-anchor="middle" class="label">iniciar()</text>

  <path d="M 500 444 L 500 500 L 220 500 L 220 560" class="edge" marker-end="url(#arrow)"/>
  <rect x="300" y="488" width="100" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="350" y="504" text-anchor="middle" class="label">finalizar()</text>

  <!-- Cancelamentos -->
  <path d="M 620 92 L 860 92 L 860 560" class="edge" marker-end="url(#arrow)"/>
  <rect x="870" y="300" width="92" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="916" y="316" text-anchor="middle" class="label">cancelar()</text>

  <path d="M 620 252 L 820 252 L 820 560" class="edge" marker-end="url(#arrow)"/>
  <rect x="830" y="400" width="92" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="876" y="416" text-anchor="middle" class="label">cancelar()</text>

  <path d="M 620 412 L 780 412 L 780 560" class="edge" marker-end="url(#arrow)"/>
  <rect x="790" y="500" width="92" height="22" rx="4" fill="#FFFFFF" fill-opacity="0.95"/>
  <text x="836" y="516" text-anchor="middle" class="label">cancelar()</text>

  <!-- Fim -->
  <path d="M 220 624 L 220 680 L 500 680 L 500 698" class="edge" marker-end="url(#arrow)"/>
  <path d="M 780 624 L 780 680 L 500 680" class="edge"/>
  <circle cx="500" cy="710" r="13" fill="#FFFFFF" stroke="#1E293B" stroke-width="2"/>
  <circle cx="500" cy="710" r="6" fill="#1E293B"/>
</svg>
